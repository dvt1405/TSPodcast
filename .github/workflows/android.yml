name: Android Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      buildType:
        description: 'Build type (debug or release)'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
      releaseNotes:
        description: 'Release notes for this build'
        required: true
        default: 'New release with improvements and bug fixes'
      distributionGroups:
        description: 'Firebase App Distribution groups (comma-separated)'
        required: true
        default: 'tspodcastrelease'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Unit test
        run: ./gradlew test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-robolectric
          path: |
            **/build/test-results/*
            **/build/reports/*

  build:
    runs-on: ubuntu-latest

    needs: [test]

    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew    
      - name: Build with Gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Real AdMob ids so testers get the same ads setup as the store build.
          ORG_GRADLE_PROJECT_ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ORG_GRADLE_PROJECT_ADMOB_UNIT_APP_OPEN: ${{ secrets.ADMOB_UNIT_APP_OPEN }}
          ORG_GRADLE_PROJECT_ADMOB_UNIT_BANNER: ${{ secrets.ADMOB_UNIT_BANNER }}
          ORG_GRADLE_PROJECT_ADMOB_UNIT_NATIVE: ${{ secrets.ADMOB_UNIT_NATIVE }}
          ORG_GRADLE_PROJECT_ADMOB_UNIT_INTERSTITIAL: ${{ secrets.ADMOB_UNIT_INTERSTITIAL }}
          ORG_GRADLE_PROJECT_ADMOB_UNIT_REWARDED: ${{ secrets.ADMOB_UNIT_REWARDED }}
        run: ./gradlew assembleRelease

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 1

  release:
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: ./apk

      - name: Find APK path
        id: find-apk
        run: |
          APK_PATH=$(find ./apk -name "*.apk" | head -n 1)
          echo "APK Path: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Distribute to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ github.event.inputs.buildType == 'debug' && secrets.FIREBASE_DEBUG_APP_ID || secrets.FIREBASE_RELEASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: ${{ github.event.inputs.distributionGroups }}
          releaseNotes: ${{ github.event.inputs.releaseNotes || github.event.head_commit.message }}
          file: ${{ steps.find-apk.outputs.apk_path }}
