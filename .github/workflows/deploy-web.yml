name: Deploy web (VPS)

# Builds the web image (web/Dockerfile), checks it, pushes it to GHCR and
# deploys it to the VPS with deploy/scripts/deploy.sh over SSH.
# Setup and the list of secrets/variables: docs/deploy/README.md.
#
# The image never receives PODCASTINDEX_* or ANTHROPIC_API_KEY. Those values
# are only used in the deploy job to scan the built image for leaked keys.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "deploy/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to the VPS after building (only from main)"
        type: boolean
        default: true

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and check image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [[ ! "$SITE_URL" =~ ^https://[a-z0-9.-]+$ ]]; then
            echo "::error::Repository variable SITE_URL must be https://<domain> without a trailing slash (docs/deploy/README.md §4)."
            exit 1
          fi

      - name: Image name
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tspodcast-web" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Lint
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run lint

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: web
          load: true
          push: false
          provenance: false
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          # Links the GHCR package to this repository (access follows the repo).
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }}
            NEXT_PUBLIC_SITE_LOCALE=${{ vars.SITE_LOCALE || 'vi' }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for secrets (patterns)
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
        run: |
          cid="$(docker create "$IMAGE")"
          docker cp "$cid:/app" "$RUNNER_TEMP/image-app"
          docker rm "$cid" >/dev/null
          node deploy/ci/scan-secrets.mjs "$RUNNER_TEMP/image-app"

      - name: Check image runs as non-root with a healthcheck
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
        run: |
          user="$(docker image inspect -f '{{.Config.User}}' "$IMAGE")"
          health="$(docker image inspect -f '{{if .Config.Healthcheck}}yes{{end}}' "$IMAGE")"
          echo "user=$user healthcheck=$health"
          [[ -n "$user" && "$user" != "root" && "$user" != "0" ]] || { echo "::error::image runs as root"; exit 1; }
          [[ "$health" == "yes" ]] || { echo "::error::image has no HEALTHCHECK"; exit 1; }

      - name: Run it like production (read-only, no keys) and smoke test
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
        run: |
          docker run -d --name web-ci --read-only --tmpfs /tmp \
            -v /app/.next/server -v /app/.next/cache \
            --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:3000:3000 "$IMAGE"
          for _ in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' web-ci)"
            [[ "$status" == "healthy" ]] && break
            [[ "$status" == "unhealthy" ]] && break
            sleep 2
          done
          echo "health: $status"
          rc=0
          if [[ "$status" == "healthy" ]]; then
            deploy/scripts/healthcheck/smoke.sh --allow-missing-keys http://127.0.0.1:3000 || rc=1
          else
            rc=1
          fi
          docker logs --tail 80 web-ci
          docker rm -fv web-ci >/dev/null
          exit "$rc"

      - name: Push to GHCR
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
        run: docker push "$IMAGE"

  deploy:
    name: Deploy to VPS
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Required reviewers are set on this environment (docs/deploy/README.md §4).
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image for the real key values
        env:
          PODCASTINDEX_API_KEY: ${{ secrets.PODCASTINDEX_API_KEY }}
          PODCASTINDEX_API_SECRET: ${{ secrets.PODCASTINDEX_API_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [[ -z "$PODCASTINDEX_API_KEY" || -z "$PODCASTINDEX_API_SECRET" ]]; then
            echo "::warning::PODCASTINDEX_API_KEY/SECRET are not set on the production environment: only pattern checks run."
          fi
          docker pull --quiet "$IMAGE:$TAG"
          cid="$(docker create "$IMAGE:$TAG")"
          docker cp "$cid:/app" "$RUNNER_TEMP/image-app"
          docker rm "$cid" >/dev/null
          node deploy/ci/scan-secrets.mjs "$RUNNER_TEMP/image-app"

      - name: Set up SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          for v in VPS_HOST VPS_USER VPS_SSH_KEY VPS_SSH_KNOWN_HOSTS; do
            [[ -n "${!v}" ]] || { echo "::error::secret $v is not set on the production environment"; exit 1; }
          done
          SSH_KEY_FILE="$RUNNER_TEMP/tspodcast_deploy_key"
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null "$SSH_KEY_FILE"
          printf '%s\n' "$VPS_SSH_KEY" > "$SSH_KEY_FILE"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            IdentityFile $SSH_KEY_FILE
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ServerAliveInterval 15
          EOF
          chmod 600 ~/.ssh/config
          ssh vps true

      - name: Copy deploy/ to /opt/tspodcast
        run: |
          tar -C deploy -czf - . | ssh vps 'tar -C /opt/tspodcast -xzf - --no-same-owner'

      - name: Log the VPS in to GHCR
        env:
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          if [[ -z "$GHCR_USER" || -z "$GHCR_TOKEN" ]]; then
            echo "GHCR_USER/GHCR_TOKEN not set: assuming the VPS is already logged in (or the package is public)."
            exit 0
          fi
          [[ "$GHCR_USER" =~ ^[A-Za-z0-9-]+$ ]] || { echo "::error::GHCR_USER is not a GitHub user name"; exit 1; }
          # shellcheck disable=SC2029 # GHCR_USER is validated above; the token goes over stdin
          printf '%s' "$GHCR_TOKEN" | ssh vps "docker login ghcr.io -u '$GHCR_USER' --password-stdin" >/dev/null
          echo "VPS logged in to ghcr.io as $GHCR_USER"

      - name: Deploy
        run: |
          # shellcheck disable=SC2029 # TAG is the commit SHA, expanded here on purpose
          ssh vps "/opt/tspodcast/scripts/deploy.sh '$TAG'"

      - name: Public smoke test
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: deploy/scripts/healthcheck/smoke.sh --public "$SITE_URL"

      - name: Move the latest tag
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$TAG"

      - name: Remove SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/tspodcast_deploy_key" ~/.ssh/config
