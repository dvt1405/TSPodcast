name: Release to Google Play Console

# Builds the signed AAB (real AdMob ids, versionCode as committed in app/build.gradle.kts) and
# uploads it to the chosen Play track with the localized "What's new" from distribution/whatsnew.
# Needs the PLAY_STORE_SERVICE_ACCOUNT_KEY_BASE64 secret: base64 of a Google Cloud service-account
# JSON key whose account is invited in Play Console (Users and permissions) with release rights.

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      rollout:
        description: 'Staged rollout fraction for production (e.g. 0.2); empty = 100%'
        required: false
        default: ''
      bumpVersionCode:
        description: 'Add 1 to versionCode before building (only if this code was already uploaded)'
        required: false
        default: false
        type: boolean

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Check Play service account secret
        env:
          KEY: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_KEY_BASE64 }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::PLAY_STORE_SERVICE_ACCOUNT_KEY_BASE64 is not set. Upload the AAB from 'Build signed release bundle' in Play Console instead, or add the secret."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Increment versionCode
        if: ${{ inputs.bumpVersionCode }}
        run: |
          CURRENT=$(grep -oE 'defaultConfig.versionCode = [0-9]+' app/build.gradle.kts | head -1 | grep -oE '[0-9]+')
          NEW=$((CURRENT + 1))
          sed -i "s/defaultConfig.versionCode = $CURRENT/defaultConfig.versionCode = $NEW/" app/build.gradle.kts
          echo "versionCode $CURRENT -> $NEW"

      - name: Build App Bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ORG_GRADLE_PROJECT_ADMOB_UNIT_APP_OPEN: ${{ secrets.ADMOB_UNIT_APP_OPEN }}
          ORG_GRADLE_PROJECT_ADMOB_UNIT_BANNER: ${{ secrets.ADMOB_UNIT_BANNER }}
          ORG_GRADLE_PROJECT_ADMOB_UNIT_NATIVE: ${{ secrets.ADMOB_UNIT_NATIVE }}
          ORG_GRADLE_PROJECT_ADMOB_UNIT_INTERSTITIAL: ${{ secrets.ADMOB_UNIT_INTERSTITIAL }}
          ORG_GRADLE_PROJECT_ADMOB_UNIT_REWARDED: ${{ secrets.ADMOB_UNIT_REWARDED }}
        run: ./gradlew :app:bundleRelease

      - name: Upload AAB and mapping
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt

      - name: Decode service account key
        env:
          KEY: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_KEY_BASE64 }}
        run: echo "$KEY" | base64 --decode > service-account-key.json

      - name: Deploy to Google Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: service-account-key.json
          packageName: tss.t.podcast
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.rollout != '' && 'inProgress' || 'completed' }}
          userFraction: ${{ inputs.rollout != '' && inputs.rollout || '' }}
          whatsNewDirectory: distribution/whatsnew
          mappingFile: app/build/outputs/mapping/release/mapping.txt

      - name: Remove service account key
        if: always()
        run: rm -f service-account-key.json

      - name: Commit versionCode bump
        if: ${{ success() && inputs.bumpVersionCode }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: increment release versionCode [skip ci]"
          file_pattern: app/build.gradle.kts
