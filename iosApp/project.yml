# Nguồn của iosApp.xcodeproj. Sinh lại bằng: cd iosApp && xcodegen generate
# Commit cả project.yml và iosApp.xcodeproj (để mở được bằng Xcode khi không có XcodeGen).
name: iosApp

options:
  bundleIdPrefix: tss.t
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: vi
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""

targets:
  TSPodcast:
    type: application
    platform: iOS
    sources:
      - path: TSPodcast
        excludes:
          - Info.plist
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_NAME: TSPodcast
        PRODUCT_BUNDLE_IDENTIFIER: tss.t.podcast
        # Đặt ở target vì preset của XcodeGen cho app iOS ghi đè TARGETED_DEVICE_FAMILY = 1,2 ở tầng target.
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_FILE: TSPodcast/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        # Cách tích hợp A: framework static Shared do Gradle build ở phase "Compile Kotlin".
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "Shared"
    preBuildScripts:
      - name: Compile Kotlin
        script: '"$SRCROOT/scripts/compile-kotlin.sh"'
        basedOnDependencyAnalysis: false
        showEnvVars: false

schemes:
  TSPodcast:
    build:
      targets:
        TSPodcast: all
    run:
      config: Debug
    archive:
      config: Release
