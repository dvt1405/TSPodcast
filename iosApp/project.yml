# Nguồn của iosApp.xcodeproj. Sinh lại bằng: cd iosApp && xcodegen generate
# Commit cả project.yml và iosApp.xcodeproj (để mở được bằng Xcode khi không có XcodeGen).
name: iosApp

options:
  bundleIdPrefix: tss.t
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: vi
  createIntermediateGroups: true
  generateEmptyDirectories: false

# Firebase (M4 §4.3): ghim exact version (bản 12.x phát hành ≥ 2 tuần trước khi thêm). Chỉ target app link;
# NSE không link Firebase. FirebaseAnalyticsCore = Analytics không kèm IDFA/AdSupport.
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 12.19.2

settings:
  base:
    SWIFT_VERSION: "6.0"
    # shared chỉ có iosArm64 + iosSimulatorArm64 (không iosX64): simulator chỉ build arm64, nếu không
    # bản Release (ONLY_ACTIVE_ARCH = NO) link thiếu symbol Kotlin cho x86_64.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""

targets:
  TSPodcast:
    type: application
    platform: iOS
    sources:
      - path: TSPodcast
        excludes:
          - Info.plist
          - TSPodcast.entitlements
    dependencies:
      - target: TSPodcastNotificationService
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAnalyticsCore
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: Firebase
        product: FirebaseMessaging
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_NAME: TSPodcast
        PRODUCT_BUNDLE_IDENTIFIER: tss.t.podcast
        # Đặt ở target vì preset của XcodeGen cho app iOS ghi đè TARGETED_DEVICE_FAMILY = 1,2 ở tầng target.
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_FILE: TSPodcast/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # aps-environment = development; bản archive lấy giá trị của provisioning profile (M4 §4.3).
        CODE_SIGN_ENTITLEMENTS: TSPodcast/TSPodcast.entitlements
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        # Màu trong Assets.xcassets tên Primary/Secondary trùng Color.primary/.secondary của SwiftUI:
        # tắt extension sinh tự động, code dùng Color("Primary") qua Design/AppColors.swift.
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        # Icon từ brand/: bản sáng = brand/store/appstore-icon-1024.png (không alpha), bản tối/tinted = mark trắng.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        # Cách tích hợp A: framework static Shared do Gradle build ở phase "Compile Kotlin".
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "Shared"
    preBuildScripts:
      - name: Compile Kotlin
        script: '"$SRCROOT/scripts/compile-kotlin.sh"'
        basedOnDependencyAnalysis: false
        showEnvVars: false
    postCompileScripts:
      # GoogleService-Info.plist (gitignored) chỉ được chép vào app khi có; thiếu thì app chạy không Firebase.
      - name: Copy GoogleService-Info.plist
        script: '"$SRCROOT/scripts/copy-firebase-plist.sh"'
        basedOnDependencyAnalysis: false
        showEnvVars: false
    postBuildScripts:
      # Upload dSYM cho Crashlytics; bỏ qua (không fail build) khi thiếu plist.
      - name: Crashlytics dSYM
        script: '"$SRCROOT/scripts/crashlytics-upload-symbols.sh"'
        basedOnDependencyAnalysis: false
        showEnvVars: false

  # Notification Service Extension (M4 §4.4): gắn ảnh `big_image` vào push `new_podcasts`. Chỉ Foundation +
  # UserNotifications, không Shared, không Firebase. Logic tải/gắn nằm ở file dùng chung với target app để
  # TSPodcastTests test được.
  TSPodcastNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: TSPodcastNotificationService
        excludes:
          - Info.plist
      - path: TSPodcast/Notifications/RichNotification.swift
    settings:
      base:
        PRODUCT_NAME: TSPodcastNotificationService
        PRODUCT_BUNDLE_IDENTIFIER: tss.t.podcast.NotificationService
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: TSPodcastNotificationService/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

  # Unit test, chạy trong app (host = TSPodcast). Không link Shared lần nữa: symbol Kotlin lấy từ app
  # qua BUNDLE_LOADER, chỉ cần FRAMEWORK_SEARCH_PATHS để `import Shared`.
  TSPodcastTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TSPodcastTests
      # Fixture audio của M3 (AudioEngineTests); file nằm trong thư mục UI test, chỉ thuộc target test.
      - path: TSPodcastUITests/Fixtures/tone-60s.m4a
        buildPhase: resources
    dependencies:
      - target: TSPodcast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tss.t.podcast.tests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"

  # XCUITest: bộ regression cho mọi luồng tương tác (quy tắc UI test của owner).
  TSPodcastUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TSPodcastUITests
    dependencies:
      - target: TSPodcast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tss.t.podcast.uitests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic

schemes:
  TSPodcast:
    build:
      targets:
        TSPodcast: all
        TSPodcastTests: [test]
        TSPodcastUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: TSPodcastTests
        - name: TSPodcastUITests
    archive:
      config: Release

  # Chỉ unit test (luật test của owner: không UI test cho tới pha QC cuối, M4 §4.8). Test action chỉ có
  # TSPodcastTests nên `xcodebuild test -scheme TSPodcastUnit` không build target UI test.
  TSPodcastUnit:
    build:
      targets:
        TSPodcast: all
        TSPodcastTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: TSPodcastTests
